name: Build patched Windows JNI DLL

on:
  workflow_dispatch:
  push:
    branches: [fix-windows-stat64]

jobs:
  build-windows-dll:
    runs-on: windows-latest
    env:
      ANDROID_NDK_HOME: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build JNI DLL
        shell: pwsh
        run: |
          bazel build --build_tag_filters='-nowindows' //kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni

      - name: Copy DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item bazel-bin/kotlin/java/com/google/ai/edge/litertlm/jni/litertlm_jni.dll artifacts/
          Get-ChildItem artifacts/

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: litertlm_jni-windows-x86_64-patched
          path: artifacts/litertlm_jni.dll
