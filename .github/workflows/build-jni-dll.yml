name: Build patched Windows JNI DLL

on:
  workflow_dispatch:
  push:
    branches: [fix-windows-stat64]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-dll:
    name: "Build-Win-JNI"
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      ANDROID_NDK_HOME: ""
    steps:
      - name: Checkout code.
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up cache keys and bazel output base.
        id: cache-keys
        run: |
          $CACHE_RESTORE_KEY_2="${{ github.workflow }}"
          $CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}"
          $CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-${{ hashFiles('**/BUILD*') }}"
          $CACHE_KEY="$CACHE_RESTORE_KEY_0-${{ github.sha }}"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$env:GITHUB_OUTPUT"
          $SHORT_SHA=$("${{ github.sha }}".SubString(0, 8))
          echo "BAZEL_OUTPUT_BASE=D:/w-$SHORT_SHA" >> "$env:GITHUB_ENV"

      - name: Restore bazel cache.
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Build JNI DLL (statically linked)
        run: |
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build --disk_cache=~/.cache/bazel-windows `
            --build_tag_filters='-nowindows' `
            --dynamic_mode=off `
            //kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni

      - name: Copy DLL
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item "$env:BAZEL_OUTPUT_BASE/../**/litertlm_jni.dll" artifacts/ -ErrorAction SilentlyContinue
          # Fallback: find it
          $dll = Get-ChildItem -Path "$env:BAZEL_OUTPUT_BASE" -Recurse -Filter "litertlm_jni.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName artifacts/ -Force }
          else {
            $dll = Get-ChildItem -Path "bazel-bin" -Recurse -Filter "litertlm_jni.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) { Copy-Item $dll.FullName artifacts/ -Force }
          }
          Get-ChildItem artifacts/

      - name: Verify DLL is self-contained
        run: |
          $dll = Get-Item artifacts/litertlm_jni.dll
          $sizeMB = [math]::Round($dll.Length / 1MB, 1)
          Write-Host "DLL size: $sizeMB MB"
          if ($sizeMB -lt 25) {
            Write-Host "WARNING: DLL is only $sizeMB MB — may have dynamic dependencies"
            Write-Host "Upstream Maven DLL is ~39 MB (fully static). Expected similar size."
          } else {
            Write-Host "OK: DLL size looks correct for a statically-linked build"
          }
          # Verify the _stat64 patch is present
          if (Select-String -Path $dll.FullName -Pattern '_stat64' -Encoding Byte -Quiet) {
            Write-Host "OK: _stat64 patch confirmed in DLL"
          } else {
            Write-Host "FAIL: _stat64 not found in DLL"
            exit 1
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: litertlm_jni-windows-x86_64-patched
          path: artifacts/litertlm_jni.dll

      - name: Save bazel cache.
        uses: actions/cache/save@v4
        if: steps.bazel-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
